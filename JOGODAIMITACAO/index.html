<body>
    <h1>O Jogo da Imitação</h1>
    <p>Alan Turing ajudou a quebrar a maquina enigma na Segunda Guerra Mundial.</p>
    <h2>Linha do Tempo</h2>
    <div class="cartao"><strong>1912</strong><p>Nasce Alan Turing</p></div>
    <div class="cartao"><strong>1939</strong><p>Alan Turnig chega a Bletchley</p></div>
    <div class="cartao"><strong>1950</strong><p></p>Turing propões o Teste de Turing</div>

    <h2>Teclado de Enigma</h2>
    <div class="teclado">
        <span class="teclado">E</span>
        <span class="teclado">N</span>
        <span class="teclado">I</span>
        <span class="teclado">G</span>
        <span class="teclado">M</span>
        <span class="teclado">A</span>
    </div>
</body>
